name: Update official cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn
          pip install requests beautifulsoup4 pillow pytesseract

      - name: Update official card list
        run: |
          python - <<'PY'
          import requests
          import re
          import json
          import os
          import io
          import time

          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from datetime import datetime, timezone
          from PIL import Image
          import pytesseract

          BASE = "https://dcd.aikatsu.com"
          HOME = BASE + "/encore/"
          IMAGE_BASE = BASE + "/encore/images/cardlist/card/"

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0"
          })

          # =========================================================
          # index.html に既に登録されている正確なカード情報を読む
          # =========================================================

          meta_maps = {}

          try:
              with open("index.html", "r", encoding="utf-8") as f:
                  index_html = f.read()

              pattern = re.compile(
                  r'"((?:E\d+-\d+|EP-\d+)_(?:PR|ER|R|N))":'
                  r'\["([^"]*)","([^"]*)","([^"]*)","([^"]*)","([^"]*)"\]'
              )

              for m in pattern.finditer(index_html):
                  code = m.group(1)

                  meta_maps[code] = {
                      "name": m.group(2),
                      "brand": m.group(3),
                      "type": m.group(4),
                      "category": m.group(5),
                      "rarity": m.group(6)
                  }

              print("index.html から既存メタデータ:", len(meta_maps), "枚")

          except Exception as e:
              print("index.html の読み込み失敗:", e)

          # =========================================================
          # 公式サイトからカードリストURLを発見
          # =========================================================

          urls = {
              HOME,
              BASE + "/encore/cardlist/?display=1&search=true&series=629001&sort=1",
              BASE + "/encore/cardlist/?display=2&search=true&series=629001&sort=1",
              BASE + "/encore/cardlist/?display=3&search=true&series=629001&sort=1",
              # 公式プロモーションカード一覧（全プロモカード）
              BASE + "/encore/cardlist/?search=true&series=629901"
          }

          try:
              html = session.get(HOME, timeout=30).text
              soup = BeautifulSoup(html, "html.parser")

              for a in soup.select("a[href]"):
                  url = urljoin(BASE, a["href"])

                  if "/encore/cardlist/" in url:
                      urls.add(url)

          except Exception as e:
              print("公式トップ取得失敗:", e)

          # 見つかったカードリストからさらにカードリストURLを探す
          for page in list(urls):

              try:
                  html = session.get(page, timeout=30).text
                  soup = BeautifulSoup(html, "html.parser")

                  for a in soup.select("a[href]"):
                      url = urljoin(BASE, a["href"])

                      if "/encore/cardlist/" in url:
                          urls.add(url)

              except Exception as e:
                  print("ページ取得失敗:", page, e)

          # =========================================================
          # カード番号を取得
          # =========================================================

          cards = {}

          code_pattern = re.compile(
              r'(?:E\d+-\d+|EP-\d+)_(?:PR|ER|R|N)'
          )

          for url in sorted(urls):

              try:
                  html = session.get(url, timeout=30).text
                  soup = BeautifulSoup(html, "html.parser")

                  codes = code_pattern.findall(html)

                  for code in codes:
                      cards.setdefault(code, {
                          "code": code,
                          "source": url
                      })

                  # パラレル表示ページにある別画像URLを探す
                  parallel_count = 0
                  for img in soup.select("img"):
                      image_candidates = [
                          img.get("src", ""),
                          img.get("data-src", ""),
                          img.get("data-original", ""),
                          img.get("srcset", "")
                      ]
                      for image_url in image_candidates:
                          if not image_url:
                              continue
                          image_url = urljoin(url, image_url.split()[0])
                          code_match = re.search(
                              r'((?:E\d+-\d+|EP-\d+)_(?:PR|ER|R|N))',
                              image_url,
                              re.IGNORECASE
                          )
                          if not code_match:
                              continue
                          base_code = code_match.group(1)
                          normal_image = IMAGE_BASE + base_code + ".webp"
                          if image_url.split("?")[0].rstrip("/") == normal_image:
                              continue
                          if "card/" not in image_url:
                              continue
                          if any(marker in image_url.lower() for marker in ["parallel", "_p.", "_p_", "-p.", "-p_", "/p/"]):
                              parallel_code = base_code + "_P"
                              cards[parallel_code] = {
                                  "code": parallel_code,
                                  "baseCode": base_code,
                                  "image": image_url,
                                  "parallel": True,
                                  "source": url
                              }
                              parallel_count += 1
                          break

                  # パラレル版は通常版と同じ番号なので、別IDとして取り込む
                  parallel_pattern = re.compile(
                      r'(?:E\d+-\d+|EP-\d+)_(?:PR|ER|R|N)_p(\d+)\.webp',
                      re.IGNORECASE
                  )
                  parallel_codes = parallel_pattern.findall(html)
                  parallel_matches = re.finditer(
                      r'((?:E\d+-\d+|EP-\d+)_(?:PR|ER|R|N))_p(\d+)\.webp',
                      html,
                      re.IGNORECASE
                  )
                  for match in parallel_matches:
                      base_code = match.group(1)
                      parallel_number = match.group(2)
                      parallel_code = base_code + "_P" + parallel_number
                      cards[parallel_code] = {
                          "code": parallel_code,
                          "baseCode": base_code,
                          "image": IMAGE_BASE + base_code + "_p" + parallel_number + ".webp",
                          "parallel": True,
                          "source": url
                      }

                  print(
                      url,
                      "→",
                      len(codes),
                      "normal code mentions,",
                      len(parallel_codes),
                      "parallel image mentions"
                  )

              except Exception as e:

                  print(
                      "カードリスト取得失敗:",
                      url,
                      e
                  )

          # =========================================================
          # 既存 official-cards.json があれば読み込む
          # =========================================================

          old_cards = {}

          if os.path.exists("official-cards.json"):

              try:

                  with open(
                      "official-cards.json",
                      "r",
                      encoding="utf-8"
                  ) as f:

                      old_data = json.load(f)

                  for card in old_data.get("cards", []):

                      if card.get("code"):
                          old_cards[card["code"]] = card

              except Exception as e:

                  print(
                      "既存official-cards.json読み込み失敗:",
                      e
                  )

          # =========================================================
          # OCR用の既知の候補
          # =========================================================

          brands = [
              "ノーブランド",
              "エンジェリーシュガー",
              "フューチャリングガール",
              "スパイシーアゲハ",
              "ドリーミークラウン",
              "メープルリボン"
          ]

          categories = [
              "トップス&ボトムス",
              "トップス",
              "ボトムス",
              "シューズ",
              "フルコーデ",
              "アクセサリー"
          ]

          # OCRでは誤認識されやすいカードは正しい情報を手動で補正
          manual_meta = {
              "EP-031_R": {
                  "name": "ガーリーデビルトップス",
                  "brand": "エンジェリーシュガー",
                  "type": "キュート",
                  "category": "トップス",
                  "rarity": "レア"
              },
              "EP-032_R": {
                  "name": "ガーリーデビルスカート",
                  "brand": "エンジェリーシュガー",
                  "type": "キュート",
                  "category": "ボトムス",
                  "rarity": "レア"
              },
              "EP-033_R": {
                  "name": "ガーリーデビルパンプス",
                  "brand": "エンジェリーシュガー",
                  "type": "キュート",
                  "category": "シューズ",
                  "rarity": "レア"
              },
              "EP-034_R": {
                  "name": "モンスターキャットトップス",
                  "brand": "ドリーミークラウン",
                  "type": "キュート",
                  "category": "トップス",
                  "rarity": "レア"
              },
              "EP-035_R": {
                  "name": "モンスターキャットスカート",
                  "brand": "ドリーミークラウン",
                  "type": "キュート",
                  "category": "ボトムス",
                  "rarity": "レア"
              },
              "EP-036_R": {
                  "name": "モンスターキャットファーブーツ",
                  "brand": "ドリーミークラウン",
                  "type": "キュート",
                  "category": "シューズ",
                  "rarity": "レア"
              }
          }

          # OCRで名前が崩れやすいカードの名前を固定
          manual_names = {
              "EP-019_N": "エンジェリーベアマルチトップス",
              "EP-020_N": "エンジェリーベアパステルスカート",
              "EP-021_N": "エンジェリーベアスニーカー",
              "EP-022_N": "エンジェリーベアリボン"
          }

          def rarity_from_code(code):

              if code.endswith("_PR"):
                  return "プレミアムレア"

              if code.endswith("_ER"):
                  return "アンコールレア"

              if code.endswith("_R"):
                  return "レア"

              if code.endswith("_N"):
                  return "ノーマル"

              return "未設定"

          # =========================================================
          # OCR
          # =========================================================

          def read_new_card(code):

              image_url = IMAGE_BASE + code + ".webp"

              result = {
                  "name": code,
                  "brand": "未設定",
                  "type": "なし",
                  "category": "未設定",
                  "rarity": rarity_from_code(code),
                  "image": image_url,
                  "ocr": True
              }

              try:

                  response = session.get(
                      image_url,
                      timeout=30
                  )

                  response.raise_for_status()

                  image = Image.open(
                      io.BytesIO(response.content)
                  )

                  # 少し拡大してOCR
                  width, height = image.size

                  scale = 2

                  image = image.resize(
                      (
                          width * scale,
                          height * scale
                      )
                  )

                  text = pytesseract.image_to_string(
                      image,
                      lang="jpn+eng",
                      config="--psm 6"
                  )

                  print(
                      "OCR:",
                      code,
                      repr(text[:500])
                  )

                  # -----------------------------
                  # ブランド
                  # -----------------------------

                  for brand in brands:

                      if brand in text:

                          result["brand"] = brand
                          break

                  # -----------------------------
                  # カテゴリ
                  # -----------------------------

                  for category in categories:

                      if category in text:

                          result["category"] = category
                          break

                  # -----------------------------
                  # 名前
                  # -----------------------------
                  #
                  # カード名はOCRで完全一致しない場合があるため、
                  # まず短い行を候補にする
                  #

                  lines = []

                  for line in text.splitlines():

                      line = line.strip()

                      if not line:
                          continue

                      if len(line) < 2:
                          continue

                      if code in line:
                          continue

                      if line in brands:
                          continue

                      if line in categories:
                          continue

                      lines.append(line)

                                    # カード名：日本語の候補を優先
                  candidates = []
                  seen = set()

                  for raw_line in lines:
                      line = raw_line.strip()
                      if not line or line in seen:
                          continue
                      seen.add(line)

                      if code in line or len(line) > 35:
                          continue
                      if any(label in line for label in brands + categories):
                          continue

                      japanese_chars = len(
                          re.findall(r"[ぁ-んァ-ヶ一-龠]", line)
                      )

                      if japanese_chars < 3:
                          continue

                      noise = len(
                          re.findall(r"[^ぁ-んァ-ヶ一-龠ー・\s]", line)
                      )
                      score = japanese_chars * 3 - noise
                      candidates.append((score, line))

                  if candidates:
                      candidates.sort(reverse=True)
                      result["name"] = candidates[0][1]

                  return result

              except Exception as e:

                  print(
                      "OCR失敗:",
                      code,
                      e
                  )

                  return result

          # =========================================================
          # 新カードのメタデータを作る
          # =========================================================

          new_count = 0
          known_count = 0
          ocr_count = 0

          output_cards = []

          for code in sorted(cards):

              base_code = cards[code].get("baseCode", code)
              is_parallel = bool(cards[code].get("parallel"))

              # ---------------------------------------------
              # 既存 index.html の正確なデータを最優先
              # ---------------------------------------------

              if base_code in manual_meta:

                  meta = manual_meta[base_code]

                  item = {
                      "code": code,
                      "name": meta["name"] + ("（パラレル）" if is_parallel else ""),
                      "set": "第1弾（パラレル）" if is_parallel else "第1弾",
                      "parallel": is_parallel,
                      "brand": meta["brand"],
                      "type": meta["type"],
                      "category": meta["category"],
                      "rarity": meta["rarity"],
                      "image": cards[code].get("image", IMAGE_BASE + base_code + ".webp"),
                      "source": cards[code]["source"],
                      "metadataSource": "manual"
                  }

                  known_count += 1

              elif base_code in meta_maps:

                  meta = meta_maps[base_code]

                  item = {
                      "code": code,
                      "name": meta["name"] + ("（パラレル）" if is_parallel else ""),
                      "set": "第1弾（パラレル）" if is_parallel else "第1弾",
                      "parallel": is_parallel,
                      "brand": meta["brand"],
                      "type": meta["type"],
                      "category": meta["category"],
                      "rarity": meta["rarity"],
                      "image": cards[code].get("image", IMAGE_BASE + base_code + ".webp"),
                      "source": cards[code]["source"],
                      "metadataSource": "index.html"
                  }

                  known_count += 1

              # ---------------------------------------------
              # 以前のJSONにあるデータも維持
              # ---------------------------------------------

              elif code in old_cards:

                  item = old_cards[code].copy()

                  item["code"] = code
                  item["image"] = (
                      item.get("image")
                      or cards[code].get("image")
                      or IMAGE_BASE + base_code + ".webp"
                  )
                  if is_parallel:
                      item["parallel"] = True
                      item["set"] = "第1弾（パラレル）"

                  item["source"] = cards[code]["source"]

                  known_count += 1

              # ---------------------------------------------
              # 完全に新しいカード
              # ---------------------------------------------

              else:

                  print(
                      "新カード発見:",
                      code
                  )

                  ocr = read_new_card(base_code)

                  item = {
                      "code": code,
                      "name": ocr["name"] + ("（パラレル）" if is_parallel else ""),
                      "set": "第1弾（パラレル）" if is_parallel else "第1弾",
                      "parallel": is_parallel,
                      "brand": ocr["brand"],
                      "type": ocr["type"],
                      "category": ocr["category"],
                      "rarity": ocr["rarity"],
                      "image": cards[code].get("image", ocr["image"]),
                      "source": cards[code]["source"],
                      "metadataSource": "OCR"
                  }

                  new_count += 1
                  ocr_count += 1

                  # 連続アクセスを少し抑える
                  time.sleep(0.5)

              if base_code in manual_names:
                  item["name"] = manual_names[base_code] + ("（パラレル）" if is_parallel else "")
                  item["metadataSource"] = "manual-name"

              output_cards.append(item)

          # =========================================================
          # JSON保存
          # =========================================================

          data = {
              "updatedAt": datetime.now(
                  timezone.utc
              ).isoformat(),

              "sources": sorted(urls),

              "cards": output_cards
          }

          with open(
              "official-cards.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("================================")
          print("公式カード更新完了")
          print("================================")
          print("発見したカード:", len(output_cards), "枚")
          print("既存メタデータ:", known_count, "枚")
          print("新規カード:", new_count, "枚")
          print("OCR実行:", ocr_count, "枚")
          print("確認したページ:", len(urls), "ページ")
          print("================================")

          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add official-cards.json

          git diff --cached --quiet || git commit -m "Update official card list"

          git push
