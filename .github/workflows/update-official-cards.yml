name: Update official cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install packages
        run: pip install requests beautifulsoup4

      - name: Update official card list
        run: |
          python - <<'PY'
          import requests
          import re
          import json
          from datetime import datetime, timezone

          url = "https://dcd.aikatsu.com/encore/cardlist/?display=1&search=true&series=629001&sort=1"

          html = requests.get(
              url,
              headers={"User-Agent": "Mozilla/5.0"},
              timeout=30
          ).text

          codes = sorted(set(
              re.findall(r'E\d+-\d+_(?:PR|ER|R|N)', html)
          ))

          cards = [
              {
                  "code": code
              }
              for code in codes
          ]

          data = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "source": url,
              "cards": cards
          }

          with open("official-cards.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print(f"Found {len(cards)} cards")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add official-cards.json
          git diff --cached --quiet || git commit -m "Update official card list"
          git push
