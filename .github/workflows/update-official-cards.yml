name: Update official cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install packages
        run: pip install requests beautifulsoup4

      - name: Update official card list
        run: |
          python - <<'PY'
          import requests
          import re
          import json
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from datetime import datetime, timezone

          BASE = "https://dcd.aikatsu.com"
          HOME = BASE + "/encore/"

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0"
          })

          urls = {HOME}

          # 公式トップページからカードリストのURLを探す
          html = session.get(HOME, timeout=30).text
          soup = BeautifulSoup(html, "html.parser")

          for a in soup.select("a[href]"):
              url = urljoin(BASE, a["href"])
              if "/encore/cardlist/" in url:
                  urls.add(url)

          # 見つかったカードリストからさらにカードリストURLを探す
          for page in list(urls):
              try:
                  html = session.get(page, timeout=30).text
                  soup = BeautifulSoup(html, "html.parser")

                  for a in soup.select("a[href]"):
                      url = urljoin(BASE, a["href"])
                      if "/encore/cardlist/" in url:
                          urls.add(url)
              except Exception as e:
                  print("ページ取得失敗:", page, e)

          cards = {}

          # 発見したすべてのカードリストからカード番号を取得
          for url in sorted(urls):
              try:
                  html = session.get(url, timeout=30).text

                  codes = re.findall(
                      r'(?:E\d+-\d+|EP-\d+)_(?:PR|ER|R|N)',
                      html
                  )

                  for code in codes:
                      cards[code] = {
                          "code": code,
                          "source": url
                      }

                  print(url, "→", len(codes), "cards")

              except Exception as e:
                  print("カードリスト取得失敗:", url, e)

          data = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "sources": sorted(urls),
              "cards": sorted(
                  cards.values(),
                  key=lambda x: x["code"]
              )
          }

          with open(
              "official-cards.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("発見したカード:", len(cards), "枚")
          print("確認したページ:", len(urls), "ページ")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add official-cards.json
          git diff --cached --quiet || git commit -m "Update official card list"
          git push
